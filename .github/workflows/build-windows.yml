name: Build Windows Desktop (exe)

# 没有 Windows 机器也能给 Windows 用户出 exe：GitHub Actions 的 Windows runner 在云端自动打包。
on:
  workflow_dispatch:        # 手动：仓库 → Actions → 本工作流 → Run workflow
  push:
    tags:
      - 'v*'               # 推送 v 开头 tag 自动触发，如 git tag v1.0.0 && git push --tags

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
        shell: pwsh

      - name: Ensure Whisper model (models/ 不进 git，构建时下载)
        env:
          PYTHONUTF8: "1"   # 强制 Python 用 utf-8，避免 Windows runner(cp1252)打印中文报错
        run: |
          if (-not (Test-Path models/faster-whisper-base)) {
            # GitHub runner 在境外，用官方 HF 源更快（脚本默认国内镜像，这里覆盖）
            $env:HF_ENDPOINT = "https://huggingface.co"
            python scripts/download_model.py --size base
          }
        shell: pwsh

      - name: Build with PyInstaller
        run: pyinstaller build_desktop.spec
        shell: pwsh

      - name: Smoke test (NO_GUI 模式，验证后端+静态托管被正确打包)
        env:
          PYTHONUTF8: "1"   # 同上：exe 内嵌 Python 打印中文也需 utf-8
        run: |
          $env:NO_GUI = "1"
          $out = "smoke_stdout.log"
          $err = "smoke_stderr.log"
          # 重定向 exe 的 stdout/stderr，console=False 也能抓到 Python 报错（否则真因被吞）
          $proc = Start-Process -FilePath "dist/ClassroomAgent/ClassroomAgent.exe" -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            try {
              # find_free_port 可能选 8000-8029，逐个试
              for ($p = 8000; $p -le 8029; $p++) {
                $r1 = Invoke-WebRequest -Uri "http://127.0.0.1:$p/c/congcong" -UseBasicParsing -ErrorAction SilentlyContinue
                $r2 = Invoke-WebRequest -Uri "http://127.0.0.1:$p/" -UseBasicParsing -ErrorAction SilentlyContinue
                if ($r1.StatusCode -eq 200 -and $r2.StatusCode -eq 200) { $ok = $true; break }
              }
            } catch {}
            if ($ok) { break }
          }
          if (-not $ok) {
            Write-Host "===== EXE STDOUT ====="
            Get-Content $out -ErrorAction SilentlyContinue
            Write-Host "===== EXE STDERR ====="
            Get-Content $err -ErrorAction SilentlyContinue
            Write-Error "冒烟测试失败：后端未正常启动（详见上方 EXE 输出）"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "冒烟测试通过：聊天页与管理端均返回 200"
          Stop-Process -Id $proc.Id -Force
        shell: pwsh

      - name: Package dist folder
        run: Compress-Archive -Path "dist/ClassroomAgent" -DestinationPath "classroom-agent-windows.zip"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: classroom-agent-windows
          path: classroom-agent-windows.zip
          retention-days: 30
